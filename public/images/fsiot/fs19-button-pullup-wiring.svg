  <rect x="480" y="270" width="100" height="48" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="2.5"/>
  <text x="530" y="300" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#F57F17">2 220 ohm</text>
  <path d="M580 294 H650" stroke="#2E7D32" stroke-width="4" fill="none"/>
  <circle cx="690" cy="294" r="28" fill="#FFECB3" stroke="#FF8F00" stroke-width="3"/>
  <text x="690" y="300" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#E65100">LED</text>
  <text x="690" y="340" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1B5E20">3 LED GPIO 2</text>
  <path d="M718 294 H780 V344 H125" stroke="#455A64" stroke-width="4" fill="none"/>

  <rect x="280" y="390" width="620" height="100" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="420" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Cara baca diagram:</text>
  <text x="300" y="445" font-family="Segoe UI,sans-serif" font-size="13" fill="#333">1) Satu kaki tombol ke GPIO 27  -  kaki pasangan ke GND (INPUT_PULLUP di kode).</text>
  <text x="300" y="468" font-family="Segoe UI,sans-serif" font-size="13" fill="#333">2-3) LED + resistor 220 ohm tetap di GPIO 2 seperti FS-18.</text>
  <text x="300" y="491" font-family="Segoe UI,sans-serif" font-size="13" fill="#B71C1C">Jangan wiring tombol ke GPIO 0 (bisa masuk mode download).</text>
