  <text x="480" y="36" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">Gambar utama  wiring FS-19 (INPUT_PULLUP)</text>
  <text x="480" y="62" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="14" fill="#555">Tombol GPIO 27 ke GND + LED GPIO 2 (pola FS-18). Tanpa resistor 10 kOhm ekstra.</text>

  <rect x="40" y="90" width="200" height="360" rx="10" fill="#1B5E20" stroke="#0D3B12" stroke-width="3"/>
  <text x="140" y="120" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fff">ESP32</text>
  <text x="140" y="142" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#C8E6C9">DevKitC-1</text>
  <rect x="55" y="170" width="70" height="28" rx="4" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="90" y="189" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#0D47A1">GPIO 27</text>
  <rect x="55" y="220" width="70" height="28" rx="4" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="90" y="239" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#263238">GND</text>
  <rect x="55" y="280" width="70" height="28" rx="4" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
  <text x="90" y="299" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#1B5E20">GPIO 2</text>
  <rect x="55" y="330" width="70" height="28" rx="4" fill="#ECEFF1" stroke="#455A64" stroke-width="2"/>
  <text x="90" y="349" text-anchor="middle" font-family="Consolas,monospace" font-size="13" font-weight="700" fill="#263238">GND</text>

  <path d="M125 184 H280" stroke="#1565C0" stroke-width="4" fill="none"/>
  <path d="M125 234 H280 V300 H360" stroke="#455A64" stroke-width="4" fill="none"/>
  <rect x="280" y="160" width="120" height="70" rx="8" fill="#FFF3E0" stroke="#EF6C00" stroke-width="3"/>
  <circle cx="340" cy="195" r="18" fill="#212121"/>
  <circle cx="340" cy="195" r="10" fill="#757575"/>
  <text x="340" y="250" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#E65100">1 Tombol</text>
  <text x="340" y="270" text-anchor="middle" font-family="Segoe UI,sans-serif" font-size="12" fill="#666">lintasi parit tengah</text>

