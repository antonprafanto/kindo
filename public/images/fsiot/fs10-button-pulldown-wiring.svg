<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d">
  <title id="t">Rangkaian tombol + resistor pull-down 10 k? — uji node sinyal dengan multimeter (belum ke GPIO)</title>
  <desc id="d">Breadboard: 3V3 ke satu kaki tombol; kaki tombol lain = node sinyal S. Resistor 10 k? dari S ke GND. Multimeter V DC: probe merah di S, hitam di GND. Belum ada kabel ke pin ESP32 GPIO.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}
      .bb{fill:#e2e8f0;stroke:#94a3b8;stroke-width:1.5}
      .lab{font-family:Segoe UI,system-ui,sans-serif;fill:#0f172a}
      .muted{fill:#64748b;font-size:12px}
      .t{font-size:15px;font-weight:700}
      .s{font-size:13px}
      .box{fill:#fff;stroke:#64748b;stroke-width:1.5;rx:8}
      .r5{fill:#fff7ed;stroke:#ea580c;stroke-width:1.5}
      .mm{fill:#ecfdf5;stroke:#059669;stroke-width:1.5}
      .call{fill:#eff6ff;stroke:#2563eb;stroke-width:1.2}
    </style>
  </defs>
  <rect width="920" height="520" class="bg"/>
  <text x="24" y="36" class="lab t">FS-10 · Tombol + pull-down 10 k? · uji node sinyal (belum ke GPIO)</text>
  <text x="24" y="58" class="lab muted">Sumber 3V3 ESP32 · resistor 10 k? · tombol · multimeter mode V DC · belum coding</text>

  <rect x="40" y="90" width="520" height="280" class="bb" rx="10"/>
  <text x="56" y="118" class="lab s" font-weight="700">Breadboard (skema berlabel)</text>

  <rect x="56" y="130" width="488" height="22" fill="#fecaca" opacity="0.55" rx="4"/>
  <text x="64" y="146" class="lab" font-size="11" fill="#991b1b">Rail + (dari pin 3V3 ESP32)</text>
  <rect x="56" y="330" width="488" height="22" fill="#bbf7d0" opacity="0.55" rx="4"/>
  <text x="64" y="346" class="lab" font-size="11" fill="#166534">Rail ? (dari pin GND ESP32)</text>

  <rect x="120" y="180" width="100" height="70" class="box"/>
  <circle cx="145" cy="215" r="6" fill="#94a3b8"/>
  <circle cx="195" cy="215" r="6" fill="#94a3b8"/>
  <rect x="155" y="200" width="30" height="30" rx="4" fill="#334155"/>
  <text x="145" y="268" class="lab s" font-weight="700">Tombol</text>

  <rect x="300" y="195" width="130" height="40" class="r5" rx="6"/>
  <text x="318" y="220" class="lab s" font-weight="700">10 k? pull-down</text>
  <text x="318" y="252" class="lab muted">cokelat·hitam·oranye</text>

  <circle cx="250" cy="215" r="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="238" y="190" class="lab s" font-weight="700" fill="#1d4ed8">S</text>
  <text x="220" y="175" class="lab muted">node sinyal</text>

  <path d="M170 130 L170 180" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="176" y="158" class="lab" font-size="11" fill="#b91c1c">3V3 ? kaki A</text>
  <path d="M195 215 L240 215" stroke="#2563eb" stroke-width="3" fill="none"/>
  <text x="200" y="208" class="lab" font-size="10" fill="#1d4ed8">kaki B</text>
  <path d="M260 215 L300 215" stroke="#2563eb" stroke-width="3" fill="none"/>
  <path d="M365 235 L365 340" stroke="#166534" stroke-width="3" fill="none"/>
  <text x="372" y="290" class="lab" font-size="11" fill="#166534">ke GND</text>

  <rect x="430" y="175" width="110" height="70" class="call" rx="8"/>
  <text x="442" y="200" class="lab s" font-weight="700" fill="#1d4ed8">Belum ke</text>
  <text x="442" y="220" class="lab s" font-weight="700" fill="#1d4ed8">GPIO</text>
  <text x="442" y="240" class="lab muted">FS-11+</text>

  <rect x="600" y="130" width="280" height="220" class="mm" rx="12"/>
  <text x="620" y="160" class="lab t" fill="#065f46">Multimeter · V DC</text>
  <text x="620" y="185" class="lab s">Probe merah ? node S</text>
  <text x="620" y="208" class="lab s">Probe hitam ? GND</text>
  <rect x="620" y="230" width="240" height="48" fill="#fff" stroke="#059669" stroke-width="1.5" rx="6"/>
  <text x="640" y="260" class="lab t" fill="#047857">? 0 V (tombol lepas)</text>
  <text x="620" y="310" class="lab s">Tekan tombol ? ? 3,3 V</text>
  <text x="620" y="332" class="lab muted">Itulah HIGH / LOW di dunia nyata</text>

  <rect x="40" y="400" width="840" height="96" class="box"/>
  <text x="56" y="428" class="lab t">Cara baca skema ini</text>
  <text x="56" y="452" class="lab s">1. Tombol lepas: S diikat ke GND lewat 10 k? ? meter baca ~0 V (LOW).</text>
  <text x="56" y="474" class="lab s">2. Tombol tekan: 3V3 menyambung ke S ? meter baca ~3,3 V (HIGH). Resistor membatasi arus ke GND.</text>
  <text x="56" y="496" class="lab muted">Belum ada kabel dari S ke pin GPIO — itu modul berikutnya. Di sini cukup paham tegangan di titik S.</text>
</svg>
